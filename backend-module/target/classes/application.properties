# ===============================
# EJB CONFIGURATION
# ===============================
# Protocolo para JBoss EAP 7.4
ejb.provider-url=remote+http://localhost:8080

# Nome JNDI baseado no seu log do JBoss (ajustado para o namespace ejb:)
# Formato: ejb:/<module-name>/<bean-name>!<interface-name>
ejb.beneficio.jndi=ejb:/ejb-module/BeneficioEjbService!com.example.ejb.BeneficioEjbRemote

# ===============================
# SERVER & DB (Mantendo seus dados)
# ===============================
server.port=8082
spring.datasource.url=jdbc:h2:mem:beneficios-db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true